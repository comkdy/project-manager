[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-manager-api"
version = "0.1.0"
description = "Project Manager: PostgreSQL analytics and governed derived datasets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "sqlglot>=26,<30", "argon2-cffi>=23,<26",
  "httpx>=0.27,<1", "seaborn>=0.13,<1", "matplotlib>=3.9,<4",
  "pandas>=2.2,<4", "pytest>=8,<10",
  "plotly>=7.1,<8",
  "cryptography>=46,<52",
  "scikit-learn>=1.6,<2",
  "pyarrow>=18,<24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.chat_skills" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
